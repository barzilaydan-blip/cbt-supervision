<!-- EmailJS template: conceptualization form link (VITE_EMAILJS_TEMPLATE_ID). Variables: to_name, patient_name, form_link. Paste this as the template's HTML content. -->
<div dir="rtl" style="background:#eef3f4;padding:24px 12px;font-family:Arial,Helvetica,sans-serif;color:#132a30;">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #cfdadd;border-radius:10px;">
    <tr>
      <td style="padding:20px 24px 16px;border-bottom:2px solid #9cc9ea;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="padding-left:14px;"><img src="https://barzilaydan-blip.github.io/cbt-supervision/logo.png" alt="" height="48" style="display:block;height:48px;"></td>
          <td>
            <div style="font-size:16px;font-weight:bold;">דן ברזילי, פסיכולוג חינוכי</div>
            <div style="font-size:12px;color:#44595f;">מומחה ומדריך בטיפול ב- CBT</div>
          </td>
        </tr></table>
      </td>
    </tr>
    <tr>
      <td style="padding:22px 24px 26px;font-size:15px;line-height:1.6;">
        <p style="margin:0 0 14px;">שלום {{to_name}},</p>
        <p style="margin:0 0 18px;">לקראת מפגש ההדרכה הבא, אשמח שתמלא/י טופס המשגת מקרה עבור {{patient_name}}. אפשר למלא רק את החלקים הרלוונטיים.</p>
        <p style="margin:0;"><a href="{{form_link}}" style="display:inline-block;background:#14353d;color:#ffffff;text-decoration:none;font-weight:bold;padding:11px 22px;border-radius:8px;">פתיחת הטופס</a></p>
        <p style="margin:14px 0 0;font-size:13px;color:#44595f;">אם הכפתור לא נפתח, אפשר להעתיק את הקישור: {{form_link}}</p>
        <p style="margin:22px 0 0;">בברכה,<br>דן ברזילי</p>
      </td>
    </tr>
  </table>
</div>
